<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indexador — Legislação e Normativos (Memória SPU)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #17332c; --bg-soft: #1e453b; --ice: #f5f2ea; --card: #fffdf8; --line: #e4ddcd;
  --ink: #211f1a; --muted: #7d7668; --accent: #1e5c4f; --accent-dark: #143f36;
  --terra: #b8541f;
  --ok: #1e6b47; --ok-bg: #e5f1e8; --warn: #8a6210; --warn-bg: #f7ecd2; --bad:#a13a2a; --bad-bg:#f6e5e0;
  --mark: #f8e9a8;
  --sombra: 0 1px 2px rgba(33,31,26,.05), 0 8px 24px rgba(33,31,26,.07);
}
* { box-sizing: border-box; }
body { margin:0; font-family:"Inter",system-ui,sans-serif; background:var(--ice); color:var(--ink);
  background-image: radial-gradient(circle at 15% 0%, rgba(30,92,79,.045), transparent 40%); }
header { background:linear-gradient(150deg,var(--bg) 0%,var(--bg-soft) 80%); color:#fff; padding:22px 28px;
  border-bottom: 3px solid var(--terra); }
header .wrap { max-width:1460px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
header h1 { margin:0; font-family:"Fraunces",serif; font-weight:600; font-size:22px; }
header p { margin:4px 0 0; color:#bcd2c6; font-size:12px; letter-spacing:.6px; text-transform:uppercase; }
main { max-width:1460px; margin:0 auto; padding:22px 28px 70px; }
.hidden { display:none !important; }
.who { font-size:12.5px; color:#bcd2c6; }
.who b { color:#fff; }
.who button { background:none; border:1px solid rgba(255,255,255,.35); color:#fff; cursor:pointer; padding:6px 12px;
  border-radius:8px; font-size:12px; font-family:inherit; margin-left:8px; }
.who button:hover { background:rgba(255,255,255,.12); }

.gate { max-width:430px; margin:70px auto; background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:30px; box-shadow:var(--sombra); border-top:4px solid var(--accent); }
.gate h2 { margin:0 0 8px; font-family:"Fraunces",serif; font-weight:600; font-size:21px; }
.gate p { margin:0 0 18px; color:var(--muted); font-size:13.5px; line-height:1.6; }
.gate input { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px; font-size:14.5px;
  margin-bottom:12px; background:#fff; font-family:inherit; }
.gate button { width:100%; padding:12px 14px; border:none; border-radius:10px; background:var(--accent); color:#fff;
  font-weight:600; font-size:14.5px; cursor:pointer; font-family:inherit; }
.perfil-btn { display:block; width:100%; text-align:left; padding:12px 15px; margin-bottom:9px; border:1px solid var(--line);
  border-radius:10px; background:#fff; font-size:14px; font-weight:600; cursor:pointer; color:var(--ink); font-family:inherit; }
.perfil-btn:hover { border-color:var(--accent); background:var(--ok-bg); }

.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:18px;
  box-shadow:var(--sombra); }
h2.sec { font-family:"Fraunces",serif; font-weight:600; font-size:19px; margin:0 0 14px; }
h3.blo { font-family:"Fraunces",serif; font-weight:600; font-size:15px; margin:22px 0 10px; color:var(--accent-dark);
  border-bottom:1px solid var(--line); padding-bottom:6px; }
h3.blo:first-child { margin-top:0; }

.barra { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
select, input[type=text], input[type=date], textarea { padding:9px 11px; border:1px solid var(--line); border-radius:9px;
  font-family:inherit; font-size:13.5px; background:#fff; color:var(--ink); }
textarea { width:100%; resize:vertical; }
button.b { padding:9px 15px; border:none; border-radius:9px; background:var(--accent); color:#fff; font-weight:600;
  font-size:13.5px; cursor:pointer; font-family:inherit; }
button.b:hover { background:var(--accent-dark); }
button.b.sec { background:#fff; color:var(--accent-dark); border:1px solid var(--line); }
button.b.sec:hover { background:var(--ok-bg); }
button.b:disabled { opacity:.45; cursor:not-allowed; }

table.fila { width:100%; border-collapse:collapse; font-size:13.5px; }
table.fila th { text-align:left; padding:9px 10px; border-bottom:2px solid var(--line); color:var(--muted);
  font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; }
table.fila td { padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
table.fila tr:hover td { background:var(--ok-bg); }
table.fila a { color:var(--accent-dark); font-weight:600; text-decoration:none; cursor:pointer; }
.pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
.pill.cogec { background:var(--warn-bg); color:var(--warn); }
.pill.esp1 { background:var(--ok-bg); color:var(--ok); }
.pill.esp2 { background:#e3ecf6; color:#1c4a7a; }
.pill.fim { background:#eee; color:#666; }
.pill.duv { background:var(--mark); color:#6b5600; }

.split { display:grid; grid-template-columns: 1fr 1fr; gap:18px; align-items:start; }
@media (max-width:1100px) { .split { grid-template-columns:1fr; } }
.doc { max-height:74vh; overflow:auto; font-size:13.5px; line-height:1.75; white-space:pre-wrap; }
.doc mark { background:var(--mark); padding:0 2px; }
.ficha { max-height:74vh; overflow:auto; }

.campo { margin-bottom:14px; }
.campo label { display:block; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase;
  letter-spacing:.4px; margin-bottom:5px; }
.campo .ajuda { font-size:11.5px; color:var(--muted); margin-top:4px; font-style:italic; }
.campo select, .campo input[type=text] { width:100%; }

.arvore { border:1px solid var(--line); border-radius:10px; max-height:240px; overflow:auto; background:#fff; padding:6px; }
.no { padding:4px 6px; border-radius:6px; cursor:pointer; font-size:13px; display:flex; gap:6px; align-items:baseline; }
.no:hover { background:var(--ok-bg); }
.no .cod { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; min-width:78px; }
.no.folha { font-weight:600; }
.no.sel { background:var(--accent); color:#fff; }
.no.sel .cod { color:#cfe3da; }
.no .seta { width:14px; flex:none; color:var(--muted); font-size:10px; cursor:pointer; user-select:none; }
.no .seta:hover { color:var(--accent-dark); }
.no.sel .seta { color:#cfe3da; }

.chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; background:var(--ok-bg);
  color:var(--accent-dark); font-size:12.5px; font-weight:600; margin:0 6px 6px 0; }
.chip button { border:none; background:none; cursor:pointer; color:var(--accent-dark); font-size:14px; line-height:1; padding:0; }
.chip.cheio { background:var(--bad-bg); color:var(--bad); }

.termo { display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:8px; font-size:13px; }
.termo:hover { background:var(--ok-bg); }
.termo .badge { font-size:10.5px; padding:1px 6px; border-radius:10px; background:var(--warn-bg); color:var(--warn); font-weight:600; }
.termo .badge.em { background:var(--ok-bg); color:var(--ok); }
.termo .cnt { color:var(--muted); font-size:11.5px; }

.rel { border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px; background:#fff; font-size:13px; }
.rel .cab { display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-bottom:5px; }
.rel .tp { font-weight:700; color:var(--terra); text-transform:uppercase; font-size:11px; letter-spacing:.5px; }
.rel .ev { color:var(--muted); font-size:12px; font-style:italic; line-height:1.5; margin:6px 0; }
.rel .acoes { display:flex; gap:6px; }
.rel button { padding:4px 11px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer;
  font-size:12px; font-family:inherit; font-weight:600; }
.rel button.sim.on { background:var(--ok); color:#fff; border-color:var(--ok); }
.rel button.nao.on { background:var(--bad); color:#fff; border-color:var(--bad); }
.rel.ocr { border-left:3px solid var(--terra); }

.aviso { background:var(--warn-bg); color:var(--warn); border-radius:9px; padding:9px 12px; font-size:12.5px; margin-bottom:12px; }
.aviso.err { background:var(--bad-bg); color:var(--bad); }
.aviso.ok { background:var(--ok-bg); color:var(--ok); }
.vazio { color:var(--muted); font-size:13px; padding:14px 0; }
.rodape-acoes { position:sticky; bottom:0; background:linear-gradient(transparent, var(--card) 22%); padding:16px 0 4px;
  display:flex; gap:9px; justify-content:flex-end; }
</style>
</head>
<body>

<header><div class="wrap">
  <div>
    <h1>Indexador — Legislação e Normativos</h1>
    <p>Memória SPU · revisão de especialista</p>
  </div>
  <div class="who" id="who"></div>
</div></header>

<main>
  <div id="gate" class="gate">
    <h2>Quem é você?</h2>
    <p>Sem senha. O nome fica registrado em cada revisão e o sistema impede que a mesma pessoa atue em dois estágios do mesmo documento.</p>
    <div id="perfis"></div>
    <input id="novoNome" type="text" placeholder="ou digite seu nome para criar">
    <button onclick="criarPerfil()">Entrar</button>
    <div id="gateMsg" style="font-size:13px;margin-top:10px"></div>
  </div>

  <div id="app" class="hidden">
    <div id="telaFila">
      <div class="card">
        <h2 class="sec">Fila de revisão</h2>
        <div class="barra">
          <select id="fEstagio" onchange="carregarFila()">
            <option value="aguardando_cogec">Aguardando COGEC</option>
            <option value="aguardando_esp1">Aguardando especialista 1</option>
            <option value="aguardando_esp2">Aguardando especialista 2</option>
            <option value="concluido">Concluídos</option>
          </select>
          <select id="fTipo" onchange="carregarFila()"><option value="">Todos os tipos</option></select>
          <label style="font-size:13px;display:flex;gap:6px;align-items:center">
            <input type="checkbox" id="fTexto" checked onchange="carregarFila()"> só com texto integral
          </label>
          <button class="b sec" onclick="exportarCSV()">Exportar CSV</button>
          <span id="filaInfo" style="color:var(--muted);font-size:12.5px;margin-left:auto"></span>
        </div>
        <div id="filaBox"><div class="vazio">carregando…</div></div>
      </div>
    </div>

    <div id="telaDoc" class="hidden">
      <div class="barra">
        <button class="b sec" onclick="voltar()">← voltar para a fila</button>
        <span id="docTitulo" style="font-family:Fraunces,serif;font-weight:600;font-size:16px"></span>
        <span id="docPills" style="margin-left:auto"></span>
      </div>
      <div class="split">
        <div class="card"><div class="doc" id="docTexto"></div></div>
        <div class="card"><div class="ficha" id="ficha"></div></div>
      </div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://qxswpouusikoodqqbnzv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BusrfNtoSHQPAEygeJgP3w_3YGZTBt9';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let usuario = null, colecaoId = null, config = {};
let arvore = [], porId = {}, palavras = [], docAtual = null, relAtual = [];
let selAssuntos = [], selPalavras = [], decisoesRel = {}, campos = {};
let estagioAtual = 'cogec';

const SITUACOES = ['Vigente sem alteração','Vigente com alteração','Revogado','Revogado tacitamente'];
// Nome de órgão não é conteúdo da norma: sem esta máscara, "Patrimônio" e "União" batem
// em praticamente todo documento por causa do cabeçalho institucional.
const MASCARA = /(secretaria do patrim[oô]nio da uni[aã]o|minist[eé]rio da gest[aã]o e (da )?inova[cç][aã]o em servi[cç]os p[uú]blicos|minist[eé]rio da economia|minist[eé]rio do planejamento[^,.;]*|presid[eê]ncia da rep[uú]blica|di[aá]rio oficial da uni[aã]o|advocacia-geral da uni[aã]o|controladoria-geral da uni[aã]o)/gi;

function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escRx(s){ return (s||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* ---------- entrada ---------- */
async function iniciar(){
  const { data: perfis } = await sb.from('perfis').select('id,nome_exibicao').order('nome_exibicao');
  document.getElementById('perfis').innerHTML = (perfis||[]).map(p =>
    `<button class="perfil-btn" onclick="entrar('${p.id}','${esc(p.nome_exibicao)}')">${esc(p.nome_exibicao)}</button>`).join('');
  const salvo = localStorage.getItem('indexador_perfil');
  if (salvo) { const p = (perfis||[]).find(x => x.id === salvo); if (p) entrar(p.id, p.nome_exibicao); }
}
async function criarPerfil(){
  const nome = document.getElementById('novoNome').value.trim();
  if (!nome) return;
  const { data, error } = await sb.from('perfis').insert({ nome_exibicao: nome }).select().single();
  if (error) { document.getElementById('gateMsg').textContent = 'Erro: ' + error.message; return; }
  entrar(data.id, data.nome_exibicao);
}
async function entrar(id, nome){
  usuario = { id, nome };
  localStorage.setItem('indexador_perfil', id);
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').innerHTML = `<b>${esc(nome)}</b><button onclick="sair()">sair</button>`;
  await carregarBase();
  await carregarFila();
}
function sair(){ localStorage.removeItem('indexador_perfil'); location.reload(); }

/* ---------- base ---------- */
async function carregarBase(){
  const { data: col } = await sb.from('colecoes').select('id,config').eq('nome','Legislação e Normativos').single();
  colecaoId = col.id; config = col.config || {};

  const { data: nos } = await sb.from('taxonomia')
    .select('id,termo,definicao,codigo_tt,nivel,pai_id,caminho')
    .eq('colecao_id', colecaoId).eq('tipo','assunto').eq('origem','tt_funcoes').eq('ativo', true);
  arvore = (nos||[]).sort((a,b) => (a.codigo_tt||'').localeCompare(b.codigo_tt||''));
  arvore.forEach(n => porId[n.id] = n);
  arvore.forEach(n => n.folha = !arvore.some(f => f.pai_id === n.id));

  const { data: pcs } = await sb.from('taxonomia')
    .select('id,termo,categoria,no_assunto_id,regra_matching')
    .eq('colecao_id', colecaoId).eq('tipo','palavra_chave').eq('ativo', true);
  palavras = (pcs||[]).map(t => ({...t, n: norm(t.termo)})).filter(t => t.n.length >= 3);

  const { data: tipos } = await sb.from('documentos').select('tipo_norma').eq('colecao_id', colecaoId);
  const uniq = [...new Set((tipos||[]).map(t => t.tipo_norma).filter(Boolean))].sort();
  document.getElementById('fTipo').innerHTML = '<option value="">Todos os tipos</option>' +
    uniq.map(t => `<option>${esc(t)}</option>`).join('');
}

/* ---------- fila ---------- */
async function carregarFila(){
  const st = document.getElementById('fEstagio').value;
  const tipo = document.getElementById('fTipo').value;
  const soTexto = document.getElementById('fTexto').checked;
  let q = sb.from('documentos')
    .select('id,titulo,tipo_norma,ano_publicacao,status,em_duvida,texto,numero_norma', { count:'exact' })
    .eq('colecao_id', colecaoId).eq('status', st).order('ordem_fila', { ascending:true }).limit(120);
  if (tipo) q = q.eq('tipo_norma', tipo);
  if (soTexto) q = q.not('texto','is',null);
  const { data, count } = await q;
  const linhas = data || [];
  document.getElementById('filaInfo').textContent = `${linhas.length} exibidos de ${count||0}`;
  document.getElementById('filaBox').innerHTML = linhas.length ? `
    <table class="fila"><thead><tr><th>Norma</th><th>Tipo</th><th>Ano</th><th>Texto</th><th></th></tr></thead><tbody>
    ${linhas.map(d => `<tr>
      <td><a onclick="abrir('${d.id}')">${esc(d.titulo)}</a>
          ${d.em_duvida ? '<span class="pill duv">dúvida</span>' : ''}</td>
      <td>${esc(d.tipo_norma||'—')}</td><td>${d.ano_publicacao||'—'}</td>
      <td>${d.texto ? (d.texto.length > 400 ? 'integral' : 'curto') : '<span style="color:var(--bad)">sem texto</span>'}</td>
      <td><button class="b sec" onclick="abrir('${d.id}')">revisar</button></td></tr>`).join('')}
    </tbody></table>` : '<div class="vazio">Nada nesta fila.</div>';
}

/* ---------- documento ---------- */
async function abrir(id){
  const { data: d } = await sb.from('documentos').select('*').eq('id', id).single();
  docAtual = d;
  estagioAtual = { aguardando_cogec:'cogec', aguardando_esp1:'esp1', aguardando_esp2:'esp2' }[d.status] || 'esp1';
  selAssuntos = []; selPalavras = []; decisoesRel = {}; campos = {};

  // ficha já registrada em estágio anterior serve de ponto de partida
  const { data: ants } = await sb.from('etapas_revisao').select('*').eq('documento_id', id);
  const ant = (ants||[]).sort((a,b) => a.criado_em < b.criado_em ? 1 : -1)[0];
  if (ant) {
    campos = Object.assign({}, ant.campos || {});
    selAssuntos = (campos.assuntos || []).slice();
    selPalavras = (ant.termos || []).filter(t => t.decisao !== 'rejeitado').map(t => t.termo);
  } else {
    campos.situacao_norma = d.situacao_norma || '';
  }

  const { data: rels } = await sb.from('relacoes_norma')
    .select('*, destino:destino_id(titulo,tipo_norma), origem:origem_id(titulo,tipo_norma)')
    .or(`origem_id.eq.${id},destino_id.eq.${id}`).eq('status','pendente').limit(60);
  relAtual = rels || [];

  document.getElementById('telaFila').classList.add('hidden');
  document.getElementById('telaDoc').classList.remove('hidden');
  document.getElementById('docTitulo').textContent = d.titulo;
  document.getElementById('docPills').innerHTML =
    `<span class="pill ${estagioAtual}">${{cogec:'COGEC',esp1:'Especialista 1',esp2:'Especialista 2'}[estagioAtual]}</span>` +
    (d.fonte === 'ocr' ? ' <span class="pill duv">texto de OCR — conferir números</span>' : '') +
    (d.em_duvida ? ' <span class="pill duv">marcado com dúvida</span>' : '');
  renderDoc();
  renderFicha();
}
function voltar(){
  document.getElementById('telaDoc').classList.add('hidden');
  document.getElementById('telaFila').classList.remove('hidden');
  carregarFila();
}

function cabeca(t){
  if (!t) return '';
  const m = t.match(/\bArt\.?\s*2[ºo]/);
  return (m && m.index > 400) ? t.slice(0, m.index) : t.slice(0, 2600);
}
function renderDoc(){
  let t = docAtual.texto || '(sem texto integral extraído)';
  let html = esc(t);
  selPalavras.forEach(p => {
    const rx = new RegExp('(^|[^\\wÀ-ÿ])(' + escRx(esc(p)) + ')(?![\\wÀ-ÿ])', 'gi');
    html = html.replace(rx, '$1<mark>$2</mark>');
  });
  document.getElementById('docTexto').innerHTML = html;
}

/* ---------- sugestão de palavras-chave ---------- */
function sugerirPalavras(){
  const texto = docAtual.texto || '';
  if (!texto) return [];
  const limpo = norm(texto).replace(MASCARA, ' ');
  const cab = norm(cabeca(texto)).replace(MASCARA, ' ');
  const out = [];
  palavras.forEach(p => {
    const rx = new RegExp('(^|[^a-z0-9])' + escRx(p.n) + '(?![a-z0-9])', 'g');
    const todas = (limpo.match(rx) || []).length;
    if (!todas) return;
    const naCabeca = (cab.match(rx) || []).length > 0;
    out.push({ termo: p.termo, n: todas, cabeca: naCabeca, no: p.no_assunto_id, cat: p.categoria });
  });
  // ementa/Art. 1º primeiro: é onde está o objeto da norma, não a mera menção
  out.sort((a,b) => (b.cabeca - a.cabeca) || (b.n - a.n) || a.termo.localeCompare(b.termo));
  return out;
}

/* ---------- ficha ---------- */
function limiteAssuntos(){ return config.limite_assuntos || 3; }
function limitePalavras(){ return config.limite_palavras_chave || 6; }

function renderFicha(){
  const sug = sugerirPalavras();
  const relsAlt = relAtual.filter(r => ['altera','revoga','regulamenta','retifica'].includes(r.tipo));
  const cheioA = selAssuntos.length >= limiteAssuntos();
  const cheioP = selPalavras.length >= limitePalavras();

  document.getElementById('ficha').innerHTML = `
    <h3 class="blo">Assunto</h3>
    <div class="campo">
      <label>Selecionados — máximo ${limiteAssuntos()}</label>
      <div>${selAssuntos.length ? selAssuntos.map(id => `
        <span class="chip">${esc(porId[id] ? porId[id].caminho.split('>>').pop() : id)}
        <button onclick="tirarAssunto('${id}')">×</button></span>`).join('')
        : '<span class="vazio">nenhum — registre apenas o nível mais profundo</span>'}</div>
      ${cheioA ? '<div class="ajuda" style="color:var(--bad)">Limite atingido. Retire um para escolher outro.</div>' : ''}
      <div class="ajuda">Escolha o nível que corresponde ao que a norma trata — qualquer um serve, não precisa descer até a folha. Os ancestrais do que você escolher ficam implícitos e não são registrados.</div>
    </div>
    ${avisoArvore ? `<div class="aviso">${esc(avisoArvore)}</div>` : ''}
    <div class="arvore" id="arvoreBox">${renderArvore()}</div>
    <div class="ajuda" style="margin-top:5px">Clique na seta para abrir o ramo; clique no nome para escolher o assunto.</div>

    <h3 class="blo">Regime</h3>
    ${campoRegime()}

    <h3 class="blo">Palavras-chave</h3>
    <div class="campo">
      <label>Selecionadas — máximo ${limitePalavras()}</label>
      <div>${selPalavras.length ? selPalavras.map(t => `
        <span class="chip">${esc(t)}<button onclick="tirarPalavra('${esc(t).replace(/'/g,"\\'")}')">×</button></span>`).join('')
        : '<span class="vazio">nenhuma</span>'}</div>
      ${cheioP ? '<div class="ajuda" style="color:var(--bad)">Limite atingido.</div>' : ''}
    </div>
    <div style="max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px">
      ${sug.length ? sug.slice(0,40).map(s => `
        <div class="termo">
          <input type="checkbox" ${selPalavras.includes(s.termo)?'checked':''}
                 ${(!selPalavras.includes(s.termo) && cheioP)?'disabled':''}
                 onchange="alternarPalavra('${esc(s.termo).replace(/'/g,"\\'")}')">
          <span style="flex:1">${esc(s.termo)}</span>
          <span class="badge ${s.cabeca?'em':''}">${s.cabeca?'ementa/Art. 1º':'só no corpo'}</span>
          <span class="cnt">×${s.n}</span>
        </div>`).join('') : '<div class="vazio">Nenhum termo da taxonomia ocorre neste texto.</div>'}
    </div>

    <h3 class="blo">Situação e vigência</h3>
    <div class="campo"><label>Situação da norma</label>
      <select onchange="setCampo('situacao_norma',this.value)">
        <option value="">—</option>
        ${SITUACOES.map(s => `<option ${campos.situacao_norma===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
    <div class="campo"><label>Início de vigência</label>
      <input type="text" placeholder="dd/mm/aaaa" value="${esc(campos.data_inicio_vigencia||'')}"
             onchange="setCampo('data_inicio_vigencia',this.value)"></div>
    <div class="campo"><label>Revogado em</label>
      <input type="text" placeholder="dd/mm/aaaa" value="${esc(campos.revogado_em||'')}"
             onchange="setCampo('revogado_em',this.value)"></div>

    <h3 class="blo">Relações entre normas</h3>
    <div class="ajuda" style="margin-bottom:10px">Detectadas na ementa e no Art. 1º. Confirme uma a uma — o trecho que originou cada detecção está à vista.</div>
    ${relsAlt.length ? relsAlt.map(r => renderRel(r)).join('') : '<div class="vazio">Nenhuma relação detectada para esta norma.</div>'}

    <div class="campo" style="margin-top:16px"><label>Legislação relacionada — livre, separe com ||</label>
      <textarea rows="2" onchange="setCampo('legislacao_relacionada',this.value)">${esc(campos.legislacao_relacionada||'')}</textarea>
      <div class="ajuda">Vale para todas as normas. As relações confirmadas acima entram automaticamente.</div></div>

    <div class="campo"><label>Observações</label>
      <textarea rows="2" onchange="setCampo('observacoes',this.value)">${esc(campos.observacoes||'')}</textarea></div>

    <div class="campo">
      <label><input type="checkbox" ${docAtual.em_duvida?'checked':''} onchange="setDuvida(this.checked)">
      Tenho dúvida neste item</label>
      <div class="ajuda">Equivale à linha amarela da planilha: distingue "não preenchi por dúvida" de "ainda não chegou a vez".</div>
    </div>

    <div class="rodape-acoes">
      <button class="b sec" onclick="voltar()">cancelar</button>
      <button class="b" onclick="salvar()">salvar e avançar estágio</button>
    </div>`;
}

let expandidos = new Set();
let avisoArvore = '';

function renderArvore(){
  return arvore.filter(n => n.nivel <= 1 || visivel(n)).map(n => {
    const sel = selAssuntos.includes(n.id);
    const temFilho = arvore.some(f => f.pai_id === n.id);
    const seta = temFilho
      ? `<span class="seta" onclick="event.stopPropagation();alternarNo('${n.id}')">${expandidos.has(n.id)?'▾':'▸'}</span>`
      : '<span class="seta vazia"></span>';
    return `<div class="no ${n.folha?'folha':''} ${sel?'sel':''}" style="padding-left:${6 + (n.nivel-1)*16}px"
      onclick="selecionarNo('${n.id}')" title="${esc((n.definicao||'').slice(0,300))}">
      ${seta}<span class="cod">${esc(n.codigo_tt)}</span><span>${esc(n.termo)}</span>
    </div>`;
  }).join('');
}
function visivel(n){
  let p = porId[n.pai_id];
  while (p) { if (!expandidos.has(p.id)) return false; p = porId[p.pai_id]; }
  return true;
}
function alternarNo(id){
  expandidos.has(id) ? expandidos.delete(id) : expandidos.add(id);
  renderFicha();
}
function ancestrais(id){
  const out = []; let p = porId[(porId[id]||{}).pai_id];
  while (p) { out.push(p.id); p = porId[p.pai_id]; }
  return out;
}
function descendentes(id){
  return arvore.filter(n => ancestrais(n.id).includes(id)).map(n => n.id);
}
/* Qualquer nível é selecionável, não só a folha: obrigar a descer até a folha produziria
   precisão falsa — a pessoa escolheria um filho arbitrário só para conseguir salvar.
   Escolhido um nó, os ancestrais dele saem: já estão implícitos no caminho. */
function selecionarNo(id){
  avisoArvore = '';
  if (selAssuntos.includes(id)) { selAssuntos = selAssuntos.filter(x => x !== id); renderFicha(); return; }

  const asc = ancestrais(id), desc = descendentes(id);
  const redundantes = selAssuntos.filter(s => asc.includes(s));
  if (redundantes.length) {
    selAssuntos = selAssuntos.filter(s => !asc.includes(s));
    avisoArvore = 'Removi ' + redundantes.map(r => porId[r].termo).join(', ') +
                  ' — é ancestral do que você acabou de escolher e fica implícito no caminho.';
  }
  if (selAssuntos.some(s => desc.includes(s))) {
    avisoArvore = 'Você já escolheu um assunto mais específico dentro deste ramo. ' +
                  'Escolher o nó mais amplo junto não acrescenta — retire o específico se quiser trocar.';
    renderFicha(); return;
  }
  if (selAssuntos.length >= limiteAssuntos()) {
    avisoArvore = 'Limite de ' + limiteAssuntos() + ' assuntos atingido.';
    renderFicha(); return;
  }
  selAssuntos.push(id);
  renderFicha();
}
function tirarAssunto(id){ selAssuntos = selAssuntos.filter(x => x !== id); renderFicha(); }
function alternarPalavra(t){
  if (selPalavras.includes(t)) selPalavras = selPalavras.filter(x => x !== t);
  else if (selPalavras.length < limitePalavras()) selPalavras.push(t);
  renderFicha(); renderDoc();
}
function tirarPalavra(t){ selPalavras = selPalavras.filter(x => x !== t); renderFicha(); renderDoc(); }
function setCampo(k,v){ campos[k] = v; }
async function setDuvida(v){
  docAtual.em_duvida = v;
  await sb.from('documentos').update({ em_duvida:v, duvida_por: usuario.id, duvida_em: new Date().toISOString() })
    .eq('id', docAtual.id);
}

/* Campos condicionais, pela posição na árvore e não pelo nome do assunto:
   - regime de destinação  -> ramo 03.04.02 "Execução da destinação imobiliária"
   - regime de aquisição   -> macrofunção 03.02 "Gestão do ingresso patrimonial"
   Os valores destes dois campos vêm da Tabela Taxonômica 02/2025 (Regimes de Destinação
   Imobiliária), que ainda não foi carregada — por isso seguem como texto livre. */
function campoRegime(){
  const cods = selAssuntos.map(id => (porId[id]||{}).codigo_tt || '');
  const temDestinacao = cods.some(c => c.startsWith('03.04.02'));
  const temAquisicao  = cods.some(c => c.startsWith('03.02'));
  let html = '';
  if (temDestinacao) html += `<div class="campo"><label>Regime de destinação</label>
    <input type="text" value="${esc(campos.regime_destinacao||'')}" onchange="setCampo('regime_destinacao',this.value)">
    <div class="ajuda">Lista controlada pendente: depende da Tabela Taxonômica 02/2025 de Regimes de Destinação.</div></div>`;
  if (temAquisicao) html += `<div class="campo"><label>Regime de aquisição</label>
    <input type="text" value="${esc(campos.regime_aquisicao||'')}" onchange="setCampo('regime_aquisicao',this.value)"></div>`;
  return html || '<div class="vazio">Aparece conforme o assunto escolhido — regime de destinação em 03.04.02, regime de aquisição em 03.02.</div>';
}

function renderRel(r){
  const souOrigem = r.origem_id === docAtual.id;
  const outro = souOrigem ? (r.destino ? r.destino.titulo : r.destino_referencia)
                          : (r.origem ? r.origem.titulo : r.origem_referencia);
  const frase = souOrigem ? `Esta norma <b>${r.tipo}</b>` : `Esta norma <b>foi ${r.tipo === 'altera' ? 'alterada' : r.tipo + 'da'}</b> por`;
  const d = decisoesRel[r.id];
  const disp = (r.dispositivos_afetados||[]).length ? ` <span class="cnt">(${r.dispositivos_afetados.join(', ')})</span>` : '';
  return `<div class="rel ${r.confianca < 0.7 ? 'ocr':''}">
    <div class="cab"><span class="tp">${esc(r.tipo)}</span>
      <span class="acoes">
        <button class="sim ${d==='confirmada'?'on':''}" onclick="decidirRel('${r.id}','confirmada')">confirma</button>
        <button class="nao ${d==='rejeitada'?'on':''}" onclick="decidirRel('${r.id}','rejeitada')">não</button>
      </span></div>
    <div>${frase} <b>${esc(outro||'(referência não resolvida)')}</b>${disp}</div>
    <div class="ev">“${esc((r.evidencia||'').slice(0,240))}”</div>
  </div>`;
}
function decidirRel(id, v){ decisoesRel[id] = decisoesRel[id] === v ? undefined : v; renderFicha(); }

/* ---------- salvar ---------- */
async function salvar(){
  if (!selAssuntos.length) { if (!confirm('Nenhum assunto selecionado. Salvar assim mesmo?')) return; }

  const confirmadas = relAtual.filter(r => decisoesRel[r.id] === 'confirmada');
  const rotulos = confirmadas.map(r => {
    const souOrigem = r.origem_id === docAtual.id;
    return souOrigem ? (r.destino ? r.destino.titulo : r.destino_referencia)
                     : (r.origem ? r.origem.titulo : r.origem_referencia);
  }).filter(Boolean);
  const jaTem = (campos.legislacao_relacionada||'').split('||').map(s=>s.trim()).filter(Boolean);
  const legis = [...new Set(jaTem.concat(rotulos))].join(' || ');

  const fichaFinal = Object.assign({}, campos, {
    assuntos: selAssuntos,
    assuntos_caminho: selAssuntos.map(id => (porId[id]||{}).caminho || ''),
    legislacao_relacionada: legis,
    ato_alteracao: confirmadas.filter(r => r.tipo==='altera' && r.destino_id!==docAtual.id)
      .map(r => r.destino ? r.destino.titulo : r.destino_referencia).filter(Boolean).join(' || '),
    ato_revogacao: confirmadas.filter(r => r.tipo==='revoga' && r.origem_id!==docAtual.id)
      .map(r => r.origem ? r.origem.titulo : r.origem_referencia).filter(Boolean).join(' || '),
    norma_regulamentacao: confirmadas.filter(r => r.tipo==='regulamenta')
      .map(r => r.destino ? r.destino.titulo : r.destino_referencia).filter(Boolean).join(' || ')
  });

  const termos = selPalavras.map(t => ({ termo:t, decisao:'aceito' }));

  const { error } = await sb.from('etapas_revisao').insert({
    documento_id: docAtual.id, estagio: estagioAtual, usuario_id: usuario.id,
    termos, campos: fichaFinal
  });
  if (error) { alert('Erro ao salvar: ' + error.message); return; }

  for (const r of relAtual) {
    if (decisoesRel[r.id]) {
      await sb.from('relacoes_norma').update({
        status: decisoesRel[r.id], confirmado_por: usuario.id, confirmado_em: new Date().toISOString()
      }).eq('id', r.id);
    }
  }
  voltar();
}

/* ---------- export ---------- */
async function exportarCSV(){
  const { data: etapas } = await sb.from('etapas_revisao')
    .select('documento_id,estagio,campos,termos,criado_em').limit(2000);
  const { data: docs } = await sb.from('documentos')
    .select('id,item_id_tainacan,titulo').eq('colecao_id', colecaoId).limit(1000);
  const porDoc = {};
  (etapas||[]).forEach(e => {
    const a = porDoc[e.documento_id];
    if (!a || a.criado_em < e.criado_em) porDoc[e.documento_id] = e;
  });
  const cols = ['special_item_id','Assunto','assunto_taxonomia_2','assunto_taxonomia_3','regime_destinacao',
    'regime_aquisicao','Palavra-chave','Situação da Norma','data_inicio_vigencia','Ato de Revogação',
    'Revogado em','Norma de regulamentação','Ato de alteração','Legislação Relacionada'];
  const linhas = [cols.join(';')];
  (docs||[]).forEach(d => {
    const e = porDoc[d.id]; if (!e) return;
    const c = e.campos || {}, cam = c.assuntos_caminho || [];
    const pcs = (e.termos||[]).filter(t=>t.decisao!=='rejeitado').map(t=>t.termo).join(' || ');
    const v = [ d.item_id_tainacan||'', cam[0]||'', cam[1]||'', cam[2]||'', c.regime_destinacao||'',
      c.regime_aquisicao||'', pcs, c.situacao_norma||'', c.data_inicio_vigencia||'', c.ato_revogacao||'',
      c.revogado_em||'', c.norma_regulamentacao||'', c.ato_alteracao||'', c.legislacao_relacionada||'' ];
    linhas.push(v.map(x => `"${String(x).replace(/"/g,'""')}"`).join(';'));
  });
  const blob = new Blob(['\ufeff' + linhas.join('\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'indexacao_memoria_spu.csv';
  a.click();
}

iniciar();
</script>
